
services:
  sipconnect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sipconnect
    privileged: true
    network_mode: host  # Required for SIP/RTP ports and USB dongle access
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: sipconnect-nginx
    network_mode: host  # Same host network so it can proxy to localhost:8000
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - sipconnect
    restart: unless-stopped

# -----------------------------------------------------------------------
# Before first run:
#
# 1. Build the Vue frontend:
#      cd frontend && npm install && npm run build
#
# 2. Generate a self-signed certificate (or use mkcert for no warnings):
#      mkdir -p certs
#      openssl req -x509 -newkey rsa:4096 -nodes \
#        -keyout certs/key.pem -out certs/cert.pem -days 365 \
#        -subj "/CN=sipconnect"
#
# 3. Start everything:
#      docker-compose up -d --build
#
# Development (without Docker):
#   Terminal 1: uvicorn app.main:app --reload
#   Terminal 2: cd frontend && npm run dev   (proxies API to :8000)
# -----------------------------------------------------------------------
